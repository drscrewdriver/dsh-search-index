# dsh-search-index bundle patch
#
# When installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-search-index
#
# — the command appends `dsh-search-index` to the bundle stack, and the
# profile boot merges THIS patch (a single `insert` of the plugin row).
- insert:
    - id: dsh-search-index
      name: 'dsh-search-index'
